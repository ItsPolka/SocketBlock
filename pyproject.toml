[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "socketblock"
version = "1.0.0"
description = "Red P2P educativa con chat TCP, prueba de trabajo y leonelcoin"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
socketblock = "socketblock.cli:main"

[tool.setuptools.packages.find]
include = ["socketblock*"]
